# =====================================================================
#  RevIA - configuration commune (surchargée par application-dev.yml / application-prod.yml)
#  Toutes les valeurs sensibles viennent de variables d'environnement.
# =====================================================================
spring:
  application:
    name: revia
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # le schéma est géré par Flyway (db/migration)
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  servlet:
    multipart:
      enabled: false
  threads:
    virtual:
      enabled: false

server:
  port: ${PORT:8085}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/csv
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  application: RevIA
  version: ${revia.version}

revia:
  version: 1.5.0
  ai:
    # gemini | groq | openrouter | mistral | ollama (gratuits) · openai | anthropic (payants) · demo (règles locales, sans clé)
    provider: ${REVIA_AI_PROVIDER:demo}
    # Modèle choisi ici (ex. gemini-flash-latest, openai/gpt-oss-120b...) ; vide = modèle par défaut du fournisseur
    model: ${REVIA_AI_MODEL:}
    # La clé ne quitte jamais le serveur : variable d'environnement uniquement.
    # Vide = clé propre au fournisseur (GEMINI_API_KEY, GROQ_API_KEY, OPENAI_API_KEY… voir « cles » ci-dessous)
    api-key: ${REVIA_AI_API_KEY:}
    base-url: ${REVIA_AI_BASE_URL:}
    temperature: 0.2
    timeout-sec: ${REVIA_AI_TIMEOUT:60}   # revue et chat ; à augmenter pour un modèle local sur CPU
    max-tokens: 4096
    # Outils IA (tests, plans de test, E2E…) : réponses longues et réflexion complète du modèle
    max-tokens-outils: ${REVIA_AI_MAX_TOKENS_OUTILS:16384}
    timeout-outils-sec: ${REVIA_AI_TIMEOUT_OUTILS:180}
    max-lines: 2000
    chunk-lines: 300
    json-retries: 1
    # Langue des rapports : revue-system.st (français) ou revue-system.en.st (anglais)
    prompt-resource: ${REVIA_PROMPT:classpath:prompts/revue-system.st}
    # Chaîne de secours (fournisseurs gratuits) quand le principal atteint son quota : ex. groq,openrouter,mistral,demo
    fallback: ${REVIA_AI_FALLBACK:}
    # Clés propres à chaque fournisseur (utilisées par la chaîne de secours, ou par le principal si REVIA_AI_API_KEY est vide)
    cles:
      gemini: ${GEMINI_API_KEY:}
      groq: ${GROQ_API_KEY:}
      openrouter: ${OPENROUTER_API_KEY:}
      mistral: ${MISTRAL_API_KEY:}
      openai: ${OPENAI_API_KEY:}
      anthropic: ${ANTHROPIC_API_KEY:}
  security:
    jwt-secret: ${REVIA_JWT_SECRET:}
    jwt-minutes: ${REVIA_JWT_MINUTES:120}
    # Derrière Vercel (réécriture /api → Render) : x-vercel-forwarded-for, sinon vide
    ip-header: ${REVIA_IP_HEADER:}
  essai:
    # Essai gratuit sans compte (page d'accueil) : rien n'est enregistré
    actif: ${REVIA_ESSAI_ACTIF:true}
    max-lignes: ${REVIA_ESSAI_MAX_LIGNES:150}
    par-minute-par-ip: ${REVIA_ESSAI_MINUTE:3}
    par-jour-global: ${REVIA_ESSAI_JOUR:300}
  integrations:
    url-publique: ${REVIA_URL_PUBLIQUE:}
  quotas:
    analyses-par-minute: ${REVIA_ANALYSES_MINUTE:10}
    connexions-par-minute: ${REVIA_CONNEXIONS_MINUTE:10}
  # Quota journalier de revues par offre (une surcharge fixée par l'admin sur un compte l'emporte toujours).
  # REVIA_QUOTA_JOUR (ancien quota unique) reste accepté pour l'offre gratuite.
  offres:
    gratuit: ${REVIA_OFFRE_GRATUIT:${REVIA_QUOTA_JOUR:20}}
    pro: ${REVIA_OFFRE_PRO:200}
    equipe: ${REVIA_OFFRE_EQUIPE:1000}
  # Paddle Billing (marchand officiel, TVA mondiale). Désactivé tant que PADDLE_CLIENT_TOKEN et
  # PADDLE_WEBHOOK_SECRET ne sont pas renseignés : l'interface garde alors inscription + contact par e-mail.
  paddle:
    env: ${PADDLE_ENV:sandbox}                     # sandbox | production
    client-token: ${PADDLE_CLIENT_TOKEN:}          # public (test_… / live_…), envoyé au navigateur
    webhook-secret: ${PADDLE_WEBHOOK_SECRET:}      # secret de la destination de notification (pdl_ntfset_…)
    price-pro: ${PADDLE_PRICE_PRO:}                # pri_…
    price-equipe: ${PADDLE_PRICE_EQUIPE:}          # pri_…
    api-key: ${PADDLE_API_KEY:}                    # facultatif, serveur uniquement (portail client / résiliation)
    tolerance-sec: ${PADDLE_WEBHOOK_TOLERANCE:300}
  admin:
    email: ${REVIA_ADMIN_EMAIL:admin@revia.local}
    password: ${REVIA_ADMIN_PASSWORD:}
    nom: Administrateur RevIA
  cors:
    allowed-origins: ${REVIA_CORS_ORIGINS:http://localhost:4200}
  seed-demo-data: false

logging:
  level:
    root: INFO
    com.revia: INFO
    org.hibernate.SQL: WARN
