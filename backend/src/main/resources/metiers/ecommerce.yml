id: "ecommerce"
nom:
  fr: "E-commerce et vente en ligne"
  en: "E-commerce & online retail"
description: "Catalogue, panier, promotions, TVA par pays, stocks, commandes, retours et droit de rétractation."
description_en: "Catalogue, cart, promotions, VAT per country, stock, orders, returns and right of withdrawal."
glossaire:
  "Prix TTC / HT": "Prix toutes taxes comprises (affiché aux consommateurs dans l'UE) et hors taxes (souvent affiché en B2B)."
  "Guichet unique OSS": "Régime de TVA de l'UE : au-delà de 10 000 EUR de ventes à distance intra-UE, la TVA du pays de livraison s'applique et se déclare via un guichet unique."
  "Réservation de stock": "Blocage temporaire d'une quantité pendant le paiement, libérée à expiration ou en cas d'échec."
  "Survente": "Vente d'une quantité supérieure au stock réellement disponible."
  "Cumul de promotions": "Règles qui décident quelles remises peuvent s'additionner et dans quel ordre elles s'appliquent."
  "Droit de rétractation": "Délai de 14 jours dans l'UE pour renoncer à un achat à distance, sauf exceptions."
  "Prix de référence": "Prix le plus bas pratiqué dans les 30 jours précédant une réduction annoncée (directive Omnibus)."
  "SKU": "Référence unique d'un article dans une variante donnée (taille, couleur)."
regles:
  - id: "ECO-01"
    texte: "Le taux de TVA est déterminé par le type de produit et le pays de livraison (et non celui du vendeur) dès que le seuil OSS est franchi ; le prix affiché au consommateur est TTC."
    pourquoi: "Une TVA fausse est un redressement fiscal et un prix affiché erroné un manquement au droit de la consommation."
    exemple_bug: "Un livre livré en Allemagne est facturé avec le taux français, et un changement d'adresse de livraison ne recalcule pas la TVA."
  - id: "ECO-02"
    texte: "La TVA est calculée selon une règle d'arrondi documentée (par ligne ou sur le total) et la facture est cohérente : total TTC = somme HT + somme TVA."
    pourquoi: "Des arrondis incohérents produisent des factures non conformes et des écarts comptables."
    exemple_bug: "La TVA est arrondie par ligne dans le panier et sur le total dans la facture : 1 centime d'écart pour le client."
  - id: "ECO-03"
    texte: "Le stock est réservé de façon atomique au moment du paiement, avec une expiration, et ne peut jamais devenir négatif."
    pourquoi: "Sans réservation atomique, deux clients achètent le dernier article."
    exemple_bug: "Pendant une vente flash, 120 commandes sont acceptées pour 100 articles en stock."
  - id: "ECO-04"
    texte: "L'ordre d'application et les possibilités de cumul des promotions (codes, remises automatiques, livraison offerte) sont définis, et le total ne peut pas devenir négatif."
    pourquoi: "Les cumuls non prévus sont une source fréquente de pertes et de fraude."
    exemple_bug: "Un code de 10 EUR et une remise de 20 % s'appliquent dans un ordre différent du panier à la facture."
  - id: "ECO-05"
    texte: "Le prix et les conditions sont figés au moment de la commande ; une modification du catalogue ne change pas les commandes passées."
    pourquoi: "Le contrat est formé au prix accepté par le client."
    exemple_bug: "Le remboursement d'un retour est calculé au prix actuel, inférieur au prix payé."
  - id: "ECO-06"
    texte: "Le client peut se rétracter pendant 14 jours à compter de la réception (sauf exceptions légales) ; le remboursement intervient au plus tard 14 jours après la rétractation, frais de livraison standard inclus."
    pourquoi: "Obligation du droit de la consommation de l'UE."
    exemple_bug: "Le délai est compté depuis la date de commande et non de réception : des retours valides sont refusés."
  - id: "ECO-07"
    texte: "Une réduction de prix annoncée indique comme prix de référence le prix le plus bas des 30 derniers jours."
    pourquoi: "Directive Omnibus : les fausses réductions sont des pratiques commerciales trompeuses."
    exemple_bug: "Le prix barré affiché est le prix catalogue, alors que le produit était moins cher la semaine précédente."
  - id: "ECO-08"
    texte: "Le parcours de commande affiche clairement le prix total (taxes, livraison, frais) avant le bouton de paiement, libellé « Commande avec obligation de paiement » ou équivalent."
    pourquoi: "Exigence de la directive sur les droits des consommateurs ; sinon le client n'est pas tenu par la commande."
    exemple_bug: "Les frais de livraison n'apparaissent qu'après la saisie de la carte."
pieges:
  - titre: "Dernier article acheté deux fois"
    description: "Lecture du stock puis décrément dans deux requêtes séparées."
    test: "Lancer 50 achats simultanés du dernier article : une seule commande acceptée, stock à 0."
  - titre: "Réservations jamais libérées"
    description: "Un paiement abandonné garde le stock réservé indéfiniment."
    test: "Abandonner le paiement : la réservation expire au délai configuré et le stock redevient disponible."
  - titre: "Cumul de promotions non prévu"
    description: "Code promo, remise automatique et carte cadeau s'additionnent jusqu'à un total nul ou négatif."
    test: "Panier de 15 EUR avec un code de 10 EUR et une remise de 50 % : total conforme à la règle de cumul, jamais négatif."
  - titre: "Changement d'adresse sans recalcul"
    description: "La TVA et les frais de port restent ceux de la première adresse."
    test: "Passer la livraison de la France à l'Espagne : TVA et frais recalculés avant paiement."
  - titre: "Remboursement partiel et promotions"
    description: "Le retour d'un article d'un panier remisé rembourse le prix plein ou fait perdre la condition de la remise."
    test: "Remise « 2 achetés, le 3e offert » puis retour d'un article : montant remboursé conforme à la règle de répartition."
  - titre: "Délai de rétractation mal compté"
    description: "Départ du délai à la commande, ou livraison en plusieurs colis non prise en compte."
    test: "Commande en deux colis livrés à 5 jours d'intervalle : le délai court à partir de la réception du dernier colis."
  - titre: "Devise et arrondi d'affichage"
    description: "Le prix converti affiché diffère du montant débité."
    test: "Afficher un prix en GBP converti depuis l'EUR et vérifier que le montant débité est identique au centime."
reglementations:
  - nom: "Directive sur les droits des consommateurs (2011/83/UE)"
    rappel: "Rappel : information précontractuelle, droit de rétractation de 14 jours, bouton de commande explicite."
  - nom: "Directive Omnibus (2019/2161)"
    rappel: "Rappel : prix de référence sur 30 jours pour les réductions, transparence des avis clients et du classement."
  - nom: "TVA e-commerce UE (guichet unique OSS / IOSS)"
    rappel: "Rappel : seuil de 10 000 EUR de ventes à distance intra-UE ; TVA du pays de livraison au-delà."
  - nom: "PCI-DSS"
    rappel: "Rappel : les données de carte ne doivent pas transiter ni être stockées hors d'un environnement conforme (préférer un formulaire hébergé)."
  - nom: "European Accessibility Act"
    rappel: "Rappel : depuis juin 2025, de nombreux sites de commerce électronique doivent être accessibles (référence EN 301 549 / WCAG)."
  - nom: "DSA (règlement sur les services numériques)"
    rappel: "Rappel : obligations pour les places de marché (traçabilité des vendeurs professionnels, signalement de contenus illicites)."
questions_ba:
  - "Dans quels pays livre-t-on, et quelle TVA s'applique à chaque type de produit ?"
  - "Quelles promotions peuvent se cumuler, dans quel ordre, et avec quels plafonds ?"
  - "Quand le stock est-il réservé, combien de temps, et que se passe-t-il en cas de rupture pendant le paiement ?"
  - "Quelles sont les règles de retour, de rétractation et de remboursement (partiel, frais de port) ?"
  - "Le prix affiché est-il HT ou TTC selon le type de client (B2C, B2B) ?"
  - "Comment se comporte le site pendant un pic de trafic (soldes, vente flash) ?"
  - "Quelles exceptions au droit de rétractation s'appliquent aux produits vendus ?"
