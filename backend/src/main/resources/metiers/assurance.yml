id: "assurance"
nom:
  fr: "Assurance (IARD, vie, prévoyance, santé)"
  en: "Insurance (P&C, life, protection, health)"
description: "Cycle de vie des contrats et des sinistres, calcul des primes, franchises et plafonds, délais de carence, avenants et provisions."
description_en: "Policy and claim lifecycles, premium calculation, deductibles and limits, waiting periods, endorsements and reserves."
glossaire:
  "Souscription": "Processus d'acceptation du risque : devis, questionnaire, tarification, décision, puis émission du contrat."
  "Avenant": "Modification d'un contrat en cours (garantie, bien assuré, adresse) avec une date d'effet propre, parfois rétroactive."
  "Prime": "Prix de l'assurance ; la prime commerciale inclut la prime pure, les frais et les taxes (taxe sur les conventions d'assurance en France)."
  "Prorata temporis": "Calcul d'une prime ou d'un remboursement proportionnel à la durée réellement couverte."
  "Franchise": "Part du sinistre restant à la charge de l'assuré : absolue, relative, proportionnelle, ou en jours (arrêt de travail)."
  "Plafond de garantie": "Montant maximal indemnisé par sinistre, par an ou sur la durée du contrat."
  "Délai de carence": "Période après la souscription pendant laquelle une garantie ne joue pas encore."
  "Provision pour sinistres (réserve)": "Estimation du coût restant à payer d'un sinistre ouvert, révisée au fil de l'instruction."
  "Subrogation / recours": "Droit de l'assureur qui a indemnisé de se retourner contre le tiers responsable."
  "Sinistre tardif (IBNR)": "Sinistre survenu mais pas encore déclaré à la date d'arrêté."
  "Bonus-malus (CRM)": "Coefficient de réduction-majoration de la prime auto selon la sinistralité responsable."
regles:
  - id: "ASS-01"
    texte: "Le contrat suit un cycle d'états explicite (devis, souscrit, en vigueur, suspendu, résilié, expiré) avec des transitions autorisées et datées."
    pourquoi: "Un état incohérent fait payer un sinistre sur un contrat résilié ou facturer un contrat non émis."
    exemple_bug: "Un devis expiré peut encore être transformé en contrat au tarif d'il y a six mois."
  - id: "ASS-02"
    texte: "Un sinistre suit les états déclaré, en instruction, en expertise, réglé ou refusé, clos, et peut être réouvert ; chaque transition est tracée avec son motif."
    pourquoi: "Le suivi réglementaire, la provision et la relation client dépendent de l'état exact du dossier."
    exemple_bug: "La réouverture d'un sinistre clos crée un nouveau dossier : la franchise est appliquée une seconde fois."
  - id: "ASS-03"
    texte: "La garantie est vérifiée à la date de survenance du sinistre (contrat en vigueur, garantie souscrite, carence écoulée), et non à la date de déclaration."
    pourquoi: "C'est la date du fait générateur qui détermine la couverture."
    exemple_bug: "Un dégât des eaux survenu la veille de la résiliation mais déclaré après est refusé à tort."
  - id: "ASS-04"
    texte: "En cas de résiliation en cours d'année, la prime non courue est remboursée au prorata temporis selon la règle contractuelle (jours exacts, base 365 ou 366)."
    pourquoi: "Le remboursement de la part non couverte est souvent une obligation légale (ex. résiliation infra-annuelle loi Hamon)."
    exemple_bug: "Le prorata est calculé en mois entiers : un client résiliant le 2 du mois perd presque un mois de prime."
  - id: "ASS-05"
    texte: "L'indemnité est calculée dans l'ordre documenté : dommage évalué, vétusté, franchise, puis plafond (par sinistre puis annuel)."
    pourquoi: "Appliquer le plafond avant la franchise ou l'inverse change le montant versé."
    exemple_bug: "Le plafond de 5 000 est appliqué avant la franchise de 300 : l'assuré reçoit 4 700 au lieu de 5 000 sur un dommage de 8 000."
  - id: "ASS-06"
    texte: "Les plafonds annuels et les franchises annuelles sont consommés par tous les sinistres de la période, y compris les règlements partiels et les réouvertures."
    pourquoi: "Sans cumul, l'assureur paie au-delà de son engagement."
    exemple_bug: "Deux sinistres traités en parallèle lisent chacun le plafond restant : chacun reçoit le plafond complet."
  - id: "ASS-07"
    texte: "Un avenant a une date d'effet ; s'il est rétroactif, la prime et les sinistres survenus depuis cette date sont recalculés."
    pourquoi: "Les avenants rétroactifs sont fréquents (ajout d'un conducteur, changement de véhicule) et modifient la couverture passée."
    exemple_bug: "Un véhicule ajouté avec effet au 1er du mois n'est pas couvert pour un sinistre du 5, car l'avenant a été saisi le 10."
  - id: "ASS-08"
    texte: "Le tarif appliqué est celui en vigueur à la date d'effet (souscription, avenant, renouvellement), versionné et jamais modifié rétroactivement."
    pourquoi: "Le client doit payer le prix accepté ; un tarif écrasé rend le contrat inexplicable."
    exemple_bug: "La mise à jour de la grille tarifaire modifie la prime des contrats déjà émis lors du prochain recalcul."
  - id: "ASS-09"
    texte: "Chaque mouvement sur un sinistre (ouverture, règlement, recours) met à jour la provision, et la provision d'un sinistre clos est nulle."
    pourquoi: "Les provisions alimentent les comptes et la solvabilité (Solvabilité II, IFRS 17)."
    exemple_bug: "Un sinistre clos garde une provision de 12 000 : le bilan surestime les engagements."
  - id: "ASS-10"
    texte: "Avant la souscription, le conseil (besoins et exigences du client) et les documents précontractuels (IPID) sont remis et leur remise est horodatée."
    pourquoi: "La DDA / IDD impose le devoir de conseil et l'information précontractuelle ; la preuve incombe au distributeur."
    exemple_bug: "Le parcours en ligne permet de payer avant d'afficher l'IPID : aucune preuve de remise en cas de litige."
  - id: "ASS-11"
    texte: "Le renouvellement annuel recalcule la prime (indexation, bonus-malus, âge) et l'avis d'échéance respecte le délai légal d'envoi avant la date limite de résiliation."
    pourquoi: "Un avis tardif ouvre au client un droit de résiliation à tout moment (loi Chatel en France)."
    exemple_bug: "Le lot de renouvellement tourne 10 jours avant l'échéance : les avis partent trop tard pour les contrats concernés."
  - id: "ASS-12"
    texte: "Une même personne ou un même bien n'est pas indemnisé deux fois pour le même sinistre (détection de doublons et des cumuls d'assurances)."
    pourquoi: "La double indemnisation est une cause fréquente de fuite financière et de fraude."
    exemple_bug: "La même facture de réparation est déposée sur deux sinistres et payée deux fois."
pieges:
  - titre: "Date de survenance contre date de déclaration"
    description: "Le contrôle de couverture utilise la date du jour ou de déclaration."
    test: "Sinistre survenu le 30/06, contrat résilié le 01/07, déclaré le 05/07 : garantie acquise."
  - titre: "Prorata sur une année bissextile"
    description: "Le remboursement est calculé sur 365 jours quelle que soit l'année, ou en mois entiers."
    test: "Prime annuelle 366 EUR du 01/01/2028 au 31/12/2028, résiliation au 01/03/2028 : remboursement de 306 jours selon la règle contractuelle."
  - titre: "Ordre franchise / plafond / vétusté"
    description: "L'ordre d'application n'est pas spécifié et chaque équipe le code différemment."
    test: "Dommage 8 000, vétusté 10 %, franchise 300, plafond 5 000 : vérifier le montant attendu écrit dans la règle (ex. 5 000)."
  - titre: "Cumul concurrent des plafonds"
    description: "Deux règlements simultanés lisent le même plafond restant (condition de course)."
    test: "Lancer en parallèle deux règlements de 4 000 sur un plafond annuel de 5 000 : le total payé ne dépasse pas 5 000."
  - titre: "Délai de carence mal borné"
    description: "La carence de 90 jours est comptée à partir de la date de saisie, ou le 90e jour est inclus par erreur."
    test: "Souscription le 01/01, carence 90 jours : sinistre le 31/03 refusé, le 01/04 couvert (selon la rédaction du contrat)."
  - titre: "Avenant rétroactif ignoré"
    description: "Les sinistres déjà enregistrés ne sont pas réévalués après un avenant à effet passé."
    test: "Saisir le 10 un avenant à effet du 1er ajoutant une garantie, puis vérifier qu'un sinistre du 5 devient couvert."
  - titre: "Réouverture de sinistre"
    description: "La réouverture recrée un dossier, réapplique la franchise ou ne réactive pas la provision."
    test: "Clore puis rouvrir un sinistre : même numéro, franchise non réappliquée, provision réactivée, historique conservé."
  - titre: "Transitions d'état interdites"
    description: "L'API accepte n'importe quel passage de statut (ex. de « refusé » à « réglé » sans réinstruction)."
    test: "Tenter chaque transition non prévue par le cycle de vie : refus avec message clair et aucune modification."
  - titre: "Fractionnement de prime"
    description: "Prime annuelle payée mensuellement : la somme des 12 échéances arrondies ne fait pas la prime annuelle."
    test: "Prime de 1 000 EUR en 12 mensualités : 11 × 83,33 + 83,37 (ou règle d'ajustement documentée) = 1 000,00 exactement."
  - titre: "Taxes et frais inclus ou exclus"
    description: "Les taux de taxe sur les conventions d'assurance varient selon la garantie ; le calcul applique un taux unique."
    test: "Contrat multirisque avec deux garanties à taux différents : taxe calculée garantie par garantie."
  - titre: "Âge de l'assuré à quelle date"
    description: "L'âge tarifaire est calculé à la date du jour au lieu de la date d'effet ou de l'échéance."
    test: "Assuré ayant 65 ans entre la date du devis et la date d'effet : le tarif et l'éligibilité suivent la règle (âge à la date d'effet)."
reglementations:
  - nom: "Solvabilité II"
    rappel: "Rappel : exigences de capital, gouvernance et reporting prudentiel ; la qualité des données de provisions est contrôlée."
  - nom: "IFRS 17"
    rappel: "Rappel : norme comptable des contrats d'assurance (regroupement des contrats, marge de service contractuelle, ajustement pour risque)."
  - nom: "DDA / IDD"
    rappel: "Rappel : devoir de conseil, document d'information (IPID), prévention des conflits d'intérêts, formation des distributeurs."
  - nom: "RGPD art. 9"
    rappel: "Rappel : les données de santé (prévoyance, santé, emprunteur) sont des données sensibles soumises à des conditions renforcées."
  - nom: "Lutte anti-blanchiment (LCB-FT)"
    rappel: "Rappel : vigilance sur l'assurance vie (origine des fonds, rachats anticipés, bénéficiaires)."
  - nom: "Droit des assurances (Code des assurances, lois Hamon et Chatel)"
    rappel: "Rappel : résiliation infra-annuelle, information sur la date limite de résiliation, délais de règlement des sinistres."
questions_ba:
  - "Quels sont les états du contrat et du sinistre, et qui a le droit de faire chaque transition ?"
  - "Quelle date fait foi : survenance, déclaration, effet de l'avenant, date de paiement ?"
  - "Dans quel ordre s'appliquent vétusté, franchise et plafonds, et les plafonds sont-ils par sinistre, par an ou à vie ?"
  - "Comment calcule-t-on le prorata en cas de résiliation ou d'avenant (jours exacts, base 365/366, arrondi) ?"
  - "Quels délais de carence et d'attente existent, et comment sont-ils comptés (jour inclus ou exclu) ?"
  - "Que se passe-t-il pour un avenant rétroactif sur des sinistres déjà déclarés ?"
  - "Quels documents réglementaires (IPID, conseil) doivent être remis et prouvés avant la souscription ?"
  - "Comment la provision évolue-t-elle à chaque étape du sinistre, et qui peut la modifier ?"
  - "Quels contrôles anti-fraude ou anti-doublon doivent bloquer un règlement ?"
