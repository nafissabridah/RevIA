id: "rh"
nom:
  fr: "Ressources humaines et paie"
  en: "HR & payroll"
description: "Recrutement, temps de travail, congés, paie et dossiers salariés : calculs au prorata, conventions collectives, conservation et non-discrimination."
description_en: "Recruiting, working time, leave, payroll and employee records: proration, collective agreements, retention and non-discrimination."
glossaire:
  "Convention collective": "Accord de branche ou d'entreprise qui complète le Code du travail (salaires minima, primes, congés, préavis)."
  "Heures supplémentaires": "Heures au-delà de la durée légale ou conventionnelle, majorées (en France 25 % puis 50 % par défaut)."
  "Acquisition des congés": "En France, 2,5 jours ouvrables par mois de travail effectif, soit 30 jours ouvrables par période de référence."
  "Jours ouvrables / ouvrés": "Ouvrables : tous les jours sauf le dimanche et les fériés chômés ; ouvrés : jours effectivement travaillés dans l'entreprise."
  "Entrée / sortie en cours de mois": "Salaire calculé au prorata selon une méthode (jours calendaires, ouvrés ou heures réelles)."
  "DSN": "Déclaration sociale nominative mensuelle transmise par l'employeur aux organismes sociaux."
  "Période d'essai": "Période en début de contrat pendant laquelle chaque partie peut rompre plus librement, avec des durées maximales légales."
  "Bulletin de paie": "Document remis au salarié détaillant brut, cotisations, net à payer et net imposable."
regles:
  - id: "RH-01"
    texte: "Les calculs de paie utilisent des décimaux exacts avec un arrondi documenté par rubrique (taux, base, montant) conforme aux règles des organismes sociaux."
    pourquoi: "Un centime d'écart par rubrique et par salarié fait rejeter la DSN ou produit des régularisations."
    exemple_bug: "Le taux horaire est arrondi à 2 décimales avant multiplication par 151,67 h : 5 centimes d'écart sur le brut."
  - id: "RH-02"
    texte: "Le salaire d'une entrée ou sortie en cours de mois est proratisé selon la méthode retenue (jours calendaires, ouvrés ou heures réelles), appliquée de façon identique à tous."
    pourquoi: "La méthode change le montant ; la jurisprudence admet plusieurs méthodes mais pas l'incohérence."
    exemple_bug: "Le prorata est calculé sur 30 jours fixes : un salarié entré le 1er février touche plus qu'un mois complet."
  - id: "RH-03"
    texte: "Les heures supplémentaires sont décomptées par semaine civile (ou par cycle prévu par accord) et majorées selon les taux légaux ou conventionnels."
    pourquoi: "Le décompte mensuel compense des semaines entre elles, ce qui est interdit hors accord d'aménagement."
    exemple_bug: "Une semaine de 45 h et une de 30 h sont moyennées : aucune heure supplémentaire n'est payée."
  - id: "RH-04"
    texte: "L'acquisition des congés tient compte des absences assimilées à du travail effectif (dont, depuis 2024 en France, l'arrêt maladie selon les règles en vigueur) et du temps partiel."
    pourquoi: "Un solde de congés faux est un rappel de salaire au départ du salarié."
    exemple_bug: "Les salariés à temps partiel acquièrent moins de jours de congés que les temps plein, alors que le nombre de jours acquis est le même."
  - id: "RH-05"
    texte: "Les minima de la convention collective applicable (salaire, primes, ancienneté) sont vérifiés à chaque paie et à chaque changement de classification."
    pourquoi: "Un salaire inférieur au minimum conventionnel expose à des rappels sur plusieurs années."
    exemple_bug: "La revalorisation annuelle de la grille de branche n'est pas chargée : 40 salariés sous le minimum pendant six mois."
  - id: "RH-06"
    texte: "Les critères de tri et de sélection des candidats n'utilisent aucun critère discriminatoire (âge, sexe, origine, santé, situation familiale…), y compris indirectement via un outil automatisé."
    pourquoi: "La discrimination à l'embauche est interdite ; l'AI Act classe les systèmes d'IA de recrutement à haut risque."
    exemple_bug: "Un filtre sur « années depuis le diplôme » écarte de fait les candidats de plus de 50 ans."
  - id: "RH-07"
    texte: "Chaque type de document salarié a une durée de conservation définie (ex. bulletins de paie, candidatures non retenues) et une purge automatique."
    pourquoi: "Le RGPD impose la limitation de conservation ; certaines pièces doivent au contraire être gardées longtemps."
    exemple_bug: "Les CV des candidats refusés sont conservés sans limite et réutilisés sans les en informer."
  - id: "RH-08"
    texte: "Les données RH sensibles (santé, sanctions, rémunération) ne sont visibles que par les rôles habilités, et le manager ne voit pas le motif médical d'une absence."
    pourquoi: "Confidentialité et RGPD ; le motif médical est couvert par le secret."
    exemple_bug: "Le calendrier d'équipe affiche « arrêt maladie – opération » au lieu de « absent »."
pieges:
  - titre: "Février et mois de 31 jours"
    description: "La méthode de prorata donne des montants absurdes en février ou les mois de 31 jours."
    test: "Entrée le 15 février et sortie le 15 mars : comparer au calcul attendu de la méthode documentée."
  - titre: "Semaine à cheval sur deux mois"
    description: "Les heures supplémentaires d'une semaine qui commence fin de mois sont perdues ou comptées deux fois."
    test: "Semaine du lundi 28 septembre au dimanche 4 octobre avec 42 h : 7 heures supplémentaires payées une seule fois."
  - titre: "Temps partiel et jours fériés"
    description: "Un jour férié tombant un jour non travaillé par le salarié à temps partiel est décompté."
    test: "Salarié ne travaillant pas le lundi, lundi férié : aucune déduction, aucun jour de congé consommé."
  - titre: "Changement de convention ou de taux en cours d'année"
    description: "Les nouveaux taux de cotisation ou plafonds de la sécurité sociale sont appliqués rétroactivement ou trop tard."
    test: "Paie de décembre puis de janvier avec un plafond revalorisé : chaque mois utilise le plafond de sa période."
  - titre: "Rappels de salaire rétroactifs"
    description: "Une augmentation à effet passé n'est pas régularisée sur les mois antérieurs (cotisations, congés payés)."
    test: "Augmentation saisie en mai avec effet au 1er mars : rappel sur mars et avril avec cotisations correctes."
  - titre: "Doublon de salarié"
    description: "Une réembauche crée un second dossier : ancienneté et congés perdus ou dupliqués."
    test: "Réembaucher un ancien salarié : le système propose le dossier existant et applique les règles d'ancienneté."
reglementations:
  - nom: "Code du travail (France)"
    rappel: "Rappel : durée du travail, heures supplémentaires, congés payés, période d'essai, bulletin de paie."
  - nom: "RGPD"
    rappel: "Rappel : information des salariés et candidats, minimisation, durées de conservation, données de santé protégées (art. 9)."
  - nom: "AI Act (règlement européen sur l'IA)"
    rappel: "Rappel : les systèmes d'IA utilisés pour le recrutement ou l'évaluation des salariés sont classés à haut risque."
  - nom: "Directive sur la transparence des rémunérations (2023/970)"
    rappel: "Rappel : transposition attendue en juin 2026 ; fourchettes de salaire dans les offres et rapports d'écarts femmes-hommes."
  - nom: "DSN"
    rappel: "Rappel : déclaration mensuelle obligatoire ; les contrôles de cohérence rejettent les données incohérentes."
questions_ba:
  - "Quelle convention collective s'applique, et quels minima, primes et majorations prévoit-elle ?"
  - "Quelle méthode de prorata utilise-t-on pour les entrées, sorties et absences ?"
  - "Comment sont décomptées les heures supplémentaires (semaine, cycle, annualisation) ?"
  - "Quelles absences comptent comme travail effectif pour les congés ?"
  - "Qui voit quelles données (manager, RH, paie, salarié lui-même) ?"
  - "Combien de temps conserve-t-on chaque type de document, et qui purge ?"
  - "Un outil automatisé intervient-il dans la sélection des candidats ? Comment est-il contrôlé ?"
