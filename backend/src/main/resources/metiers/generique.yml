id: "generique"
nom:
  fr: "Générique (tous domaines)"
  en: "Generic (all domains)"
description: "Règles transverses valables dans presque tous les logiciels de gestion : dates, montants, droits, données personnelles, accessibilité et traçabilité."
description_en: "Cross-domain rules that apply to almost any business software: dates, amounts, permissions, personal data, accessibility and audit trail."
glossaire:
  "Règle de gestion (RG)": "Énoncé vérifiable d'une contrainte ou d'un calcul métier, indépendant de l'interface (ex. « une commande validée n'est plus modifiable »)."
  "Critère d'acceptation (AC)": "Condition observable qu'une user story doit remplir pour être acceptée ; chaque critère doit pouvoir être testé par oui ou non."
  "Idempotence": "Propriété d'une opération qui produit le même résultat si elle est rejouée (double clic, nouvelle tentative réseau)."
  "Piste d'audit": "Historique non modifiable de qui a fait quoi, quand, et avec quelles valeurs avant / après."
  "Donnée personnelle": "Toute information se rapportant à une personne physique identifiée ou identifiable (nom, e-mail, identifiant, adresse IP…)."
  "Valeur limite": "Valeur placée juste sur, juste sous ou juste au-dessus d'un seuil ; c'est là que se cachent la plupart des erreurs de comparaison."
  "État vide": "Ce que l'écran ou l'API renvoie quand il n'y a aucune donnée (liste vide, premier usage, recherche sans résultat)."
  "Concurrence": "Deux utilisateurs ou traitements qui modifient la même donnée en même temps ; nécessite verrouillage optimiste ou pessimiste."
regles:
  - id: "GEN-01"
    texte: "Chaque date-heure métier est stockée en UTC avec son fuseau d'origine, et affichée dans le fuseau de l'utilisateur ; les dates « calendaires » (date de naissance, échéance) sont stockées sans heure."
    pourquoi: "Les changements d'heure et les fuseaux décalent les échéances d'un jour et faussent les tris et les calculs de durée."
    exemple_bug: "Une date de naissance saisie à Paris est stockée à minuit local puis convertie en UTC : elle s'affiche la veille pour un utilisateur à Montréal."
  - id: "GEN-02"
    texte: "Les montants sont manipulés en décimal exact (ou en unités mineures entières) avec une règle d'arrondi explicite et documentée."
    pourquoi: "Les nombres à virgule flottante ne représentent pas exactement 0,10 ; les écarts d'un centime cassent les rapprochements."
    exemple_bug: "0,1 + 0,2 calculé en double donne 0,30000000000000004 : un contrôle « total == 0,30 » échoue et bloque la validation."
  - id: "GEN-03"
    texte: "Toute action qui modifie des données est autorisée côté serveur selon le rôle ET le périmètre de l'utilisateur (ses propres objets, son entité)."
    pourquoi: "Masquer un bouton dans l'interface ne protège rien : l'API reste appelable directement."
    exemple_bug: "En changeant l'identifiant dans l'URL, un client consulte la facture d'un autre client (IDOR, OWASP A01)."
  - id: "GEN-04"
    texte: "Les opérations sensibles au doublon (création, paiement, envoi) sont idempotentes grâce à une clé d'idempotence ou à une contrainte d'unicité."
    pourquoi: "Les doubles clics, les nouvelles tentatives réseau et les rejeux de file de messages sont inévitables."
    exemple_bug: "Le bouton « Valider » cliqué deux fois crée deux commandes identiques et deux e-mails de confirmation."
  - id: "GEN-05"
    texte: "Chaque champ saisi a des bornes explicites (longueur, valeurs min / max, format, caractères autorisés) vérifiées côté serveur avec un message d'erreur compréhensible."
    pourquoi: "Sans bornes, les données invalides se propagent jusqu'aux traitements de nuit et aux exports."
    exemple_bug: "Un nom de 300 caractères passe dans l'interface mais fait échouer l'insertion en base (colonne de 255) avec une erreur 500."
  - id: "GEN-06"
    texte: "Les modifications de données métier sont tracées (auteur, date, valeur avant / après, motif) et la trace n'est pas modifiable par l'utilisateur."
    pourquoi: "La traçabilité est exigée en audit et indispensable pour comprendre un incident."
    exemple_bug: "Un statut passe de « validé » à « brouillon » sans trace : impossible de savoir qui a rouvert le dossier."
  - id: "GEN-07"
    texte: "Les données personnelles ont une finalité, une base légale et une durée de conservation définies ; elles sont purgées ou anonymisées à échéance."
    pourquoi: "Le RGPD impose minimisation et limitation de la conservation ; les vieilles données sont aussi un risque de fuite."
    exemple_bug: "Les comptes clôturés depuis dix ans restent en base avec e-mail et téléphone, et apparaissent dans un export marketing."
  - id: "GEN-08"
    texte: "Les écritures concurrentes sur un même objet sont détectées (verrouillage optimiste par numéro de version) et l'utilisateur est prévenu au lieu d'écraser silencieusement."
    pourquoi: "Le « dernier qui enregistre gagne » efface le travail d'un collègue sans que personne ne le voie."
    exemple_bug: "Deux gestionnaires modifient la même fiche ; la seconde sauvegarde annule la correction d'adresse de la première."
pieges:
  - titre: "Changement d'heure (DST)"
    description: "Une journée ne dure pas toujours 24 h : ajouter 24 h ou compter des heures entre deux dates donne un résultat faux deux fois par an."
    test: "Planifier un rappel « tous les jours à 9 h » le samedi 28 mars 2026 à Paris et vérifier qu'il part le dimanche 29 à 9 h et non à 10 h."
  - titre: "Comparaison stricte ou large au seuil"
    description: "« Au-delà de 1 000 » est codé > ou >= selon le développeur ; la spécification ne tranche pas."
    test: "Tester les valeurs 999,99 ; 1 000 ; 1 000,01 et vérifier le comportement attendu écrit dans la règle."
  - titre: "Liste vide et premier usage"
    description: "Les écrans et les calculs (moyenne, pourcentage) ne prévoient pas l'absence de données."
    test: "Ouvrir le tableau de bord d'un compte neuf : aucun « NaN % », aucune division par zéro, un message d'état vide utile."
  - titre: "Pagination et tri instables"
    description: "Un tri sur une colonne non unique sans critère secondaire fait apparaître ou disparaître des lignes d'une page à l'autre."
    test: "Créer 25 éléments avec la même date, parcourir les pages de 10 et vérifier que les 25 identifiants apparaissent une seule fois."
  - titre: "Unicode, accents et casse"
    description: "Recherches, tris et unicité ignorent la normalisation (é composé ou décomposé, majuscules, espaces insécables)."
    test: "Créer « Élodie » puis rechercher « elodie » et « ELODIE » ; tenter de créer « elodie@exemple » en majuscules : doublon détecté."
  - titre: "Double soumission"
    description: "Un formulaire lent est soumis deux fois (double clic, retour navigateur, nouvelle tentative réseau)."
    test: "Envoyer deux fois la même requête de création avec la même clé d'idempotence : un seul objet créé, même réponse renvoyée."
  - titre: "Fuseau du serveur utilisé par défaut"
    description: "Le code appelle « maintenant » dans le fuseau du serveur ; un déploiement dans un autre pays décale les traitements."
    test: "Exécuter les tests avec TZ=Pacific/Auckland puis TZ=America/Los_Angeles : mêmes résultats."
reglementations:
  - nom: "RGPD"
    rappel: "Rappel : finalité, base légale, minimisation, durée de conservation, droits d'accès / effacement / portabilité, registre des traitements."
  - nom: "WCAG 2.2 / EN 301 549"
    rappel: "Rappel : niveau AA attendu pour les services publics et, avec l'European Accessibility Act, pour de nombreux services privés depuis juin 2025."
  - nom: "ISO/IEC 25010"
    rappel: "Rappel : modèle de qualité logicielle (adéquation fonctionnelle, fiabilité, sécurité, maintenabilité, utilisabilité…) utile pour formuler les exigences non fonctionnelles."
  - nom: "OWASP ASVS"
    rappel: "Rappel : référentiel d'exigences de sécurité vérifiables pour les applications web, par niveau (1 à 3)."
questions_ba:
  - "Qui sont les acteurs et quels rôles ont le droit de créer, modifier, valider ou supprimer cet objet ?"
  - "Que se passe-t-il en cas d'erreur, de délai dépassé ou de service tiers indisponible ?"
  - "Quelles sont les valeurs minimales et maximales, et le seuil est-il inclus ou exclu ?"
  - "Que voit l'utilisateur quand il n'y a aucune donnée ?"
  - "Deux personnes peuvent-elles modifier le même objet en même temps ? Qui gagne ?"
  - "Quelles données personnelles sont manipulées, pour quelle finalité et combien de temps sont-elles conservées ?"
  - "Quel volume est attendu (nombre d'objets, utilisateurs simultanés) et quel temps de réponse est acceptable ?"
  - "Quelles actions doivent être tracées et qui consulte cette trace ?"
