id: "banque-paiement"
nom:
  fr: "Banque et paiements"
  en: "Banking & payments"
description: "Virements, cartes, prélèvements et comptes : idempotence, dates de valeur, cut-off, authentification forte, rapprochement et sécurité des données de carte."
description_en: "Transfers, cards, direct debits and accounts: idempotency, value dates, cut-offs, strong customer authentication, reconciliation and card data security."
glossaire:
  "Autorisation / capture": "L'autorisation réserve le montant sur la carte ; la capture (ou remise) déclenche le débit effectif, parfois partielle ou plus tard."
  "Rétrofacturation (chargeback)": "Contestation d'un paiement carte par le porteur via sa banque, avec des délais et des motifs codifiés par le réseau."
  "SCA (authentification forte)": "Authentification à deux facteurs indépendants parmi connaissance, possession et inhérence, exigée par la DSP2."
  "Exemption SCA": "Cas où l'authentification forte peut être évitée (faible montant, bénéficiaire de confiance, analyse de risque, paiement récurrent initié par le marchand)."
  "SEPA SCT / SCT Inst / SDD": "Virement SEPA classique, virement instantané (10 secondes maximum) et prélèvement SEPA."
  "ISO 20022": "Norme de messages financiers XML (pain.001, pacs.008, camt.053…) utilisée par SEPA et les grands systèmes de paiement."
  "Mandat de prélèvement": "Autorisation donnée par le débiteur, identifiée par une référence unique de mandat (RUM) et un identifiant créancier."
  "Date de valeur": "Date à partir de laquelle un mouvement est pris en compte pour le calcul des intérêts ou des agios."
  "Rapprochement": "Comparaison entre les opérations attendues et les relevés reçus (camt.053, fichiers de remise) pour détecter les écarts."
  "PAN": "Numéro de carte ; sa conservation impose PCI-DSS ; le cryptogramme visuel (CVV) ne doit jamais être stocké après autorisation."
  "Tokenisation": "Remplacement du PAN par un jeton sans valeur exploitable hors du système de paiement."
regles:
  - id: "PAY-01"
    texte: "Toute demande de paiement porte une clé d'idempotence ; un rejeu avec la même clé renvoie le résultat initial sans nouveau débit."
    pourquoi: "Les délais réseau, les doubles clics et les nouvelles tentatives automatiques provoquent sinon des doubles débits."
    exemple_bug: "Le prestataire répond après 31 s, le client relance après 30 s : le client est débité deux fois."
  - id: "PAY-02"
    texte: "Un paiement suit des états explicites (initié, authentifié, autorisé, capturé, réglé, remboursé, rejeté, contesté) et l'état « inconnu » après un délai dépassé est résolu par une interrogation du prestataire, jamais par une nouvelle tentative aveugle."
    pourquoi: "Un délai dépassé ne signifie pas un échec : le paiement a peut-être abouti."
    exemple_bug: "Un délai dépassé est traité comme un refus ; le client repaie alors que le premier paiement avait réussi."
  - id: "PAY-03"
    texte: "Les ordres reçus après l'heure limite (cut-off) ou un jour non ouvré du système de paiement sont exécutés le jour ouvré suivant, et la date d'exécution prévue est affichée au client."
    pourquoi: "Les systèmes de règlement ont des calendriers (TARGET2) ; une date promise non tenue est une réclamation."
    exemple_bug: "Un virement SEPA classique saisi le vendredi à 18 h est affiché « exécuté aujourd'hui » alors qu'il part lundi."
  - id: "PAY-04"
    texte: "L'authentification forte est exigée pour les paiements électroniques initiés par le client, sauf exemption documentée et journalisée."
    pourquoi: "La DSP2 l'impose ; sans SCA ni exemption valide, la responsabilité de la fraude bascule vers le prestataire."
    exemple_bug: "L'exemption « faible montant » (moins de 30 EUR) est appliquée sans compter le cumul de 100 EUR ou de 5 opérations consécutives."
  - id: "PAY-05"
    texte: "Les données de carte ne sont jamais stockées en clair ; le cryptogramme n'est jamais stocké, ni journalisé, même chiffré, après l'autorisation."
    pourquoi: "PCI-DSS l'interdit ; une fuite de PAN et de CVV permet la fraude immédiate."
    exemple_bug: "Les logs de débogage de l'API contiennent le corps de la requête de paiement avec le PAN et le cryptogramme."
  - id: "PAY-06"
    texte: "Le montant capturé ne dépasse pas le montant autorisé (sauf tolérance prévue par le réseau et le secteur), et la somme des remboursements ne dépasse pas la somme capturée."
    pourquoi: "Rembourser plus que l'encaissé est une perte directe et une porte ouverte à la fraude."
    exemple_bug: "Deux remboursements partiels de 60 EUR passent sur un paiement de 100 EUR, faute de contrôle du cumul."
  - id: "PAY-07"
    texte: "Les montants sont transmis en unités mineures entières selon l'exposant ISO 4217 de la devise, et la devise accompagne toujours le montant."
    pourquoi: "Un montant sans devise ou mal converti en centimes multiplie ou divise le paiement par 100."
    exemple_bug: "1 000 JPY envoyés comme « 100000 » car le code multiplie toujours par 100 : le client paie 100 000 JPY."
  - id: "PAY-08"
    texte: "Chaque jour, les opérations internes sont rapprochées des relevés du prestataire ou de la banque ; tout écart est mis en file d'anomalies avec un responsable."
    pourquoi: "Sans rapprochement, les paiements perdus, doublés ou orphelins ne sont découverts que par les clients."
    exemple_bug: "Les notifications de webhook perdues laissent des commandes « en attente » alors que le paiement est réglé."
  - id: "PAY-09"
    texte: "Les notifications du prestataire (webhooks) sont authentifiées par signature, traitées de façon idempotente et dans un ordre tolérant aux arrivées désordonnées."
    pourquoi: "Les webhooks sont rejoués, dupliqués et parfois reçus dans le désordre."
    exemple_bug: "L'événement « remboursé » arrive avant « capturé » : le statut final enregistré est « capturé »."
  - id: "PAY-10"
    texte: "Avant d'exécuter un virement, le bénéficiaire est filtré contre les listes de sanctions et, pour les virements en euros, la vérification du bénéficiaire (nom et IBAN) est effectuée."
    pourquoi: "Le règlement européen sur les virements instantanés impose la vérification du bénéficiaire depuis octobre 2025 ; le filtrage des sanctions est obligatoire."
    exemple_bug: "Le contrôle de concordance nom / IBAN n'est fait que pour les virements instantanés, pas pour les virements classiques."
pieges:
  - titre: "Délai dépassé traité comme un échec"
    description: "Après un délai réseau, le système annule ou relance sans connaître le vrai statut."
    test: "Simuler une réponse du prestataire après le délai : le paiement doit passer en « à vérifier », puis être réconcilié sans second débit."
  - titre: "Double débit par nouvelle tentative"
    description: "La clé d'idempotence est régénérée à chaque tentative au lieu d'être conservée."
    test: "Rejouer 3 fois la même requête avec la même clé : un seul débit, trois réponses identiques."
  - titre: "Cumul des exemptions SCA"
    description: "Les compteurs de l'exemption faible montant ne sont ni cumulés ni réinitialisés après une SCA."
    test: "Enchaîner 6 paiements de 20 EUR sans SCA : la SCA doit être exigée au plus tard à la 6e opération ou au-delà de 100 EUR cumulés."
  - titre: "Remboursements partiels concurrents"
    description: "Deux remboursements simultanés lisent le même reste remboursable."
    test: "Lancer en parallèle deux remboursements de 60 EUR sur un paiement de 100 EUR : un seul accepté."
  - titre: "Jours fériés TARGET2 et cut-off"
    description: "Le calendrier ignore le 1er mai, le Vendredi saint ou le lundi de Pâques TARGET2, ou compare le cut-off dans le mauvais fuseau."
    test: "Virement classique saisi le Jeudi saint à 17 h 30 heure de Paris : date d'exécution prévue le mardi suivant (selon le cut-off documenté)."
  - titre: "Webhooks désordonnés ou dupliqués"
    description: "Le statut est écrasé par un événement plus ancien reçu après."
    test: "Envoyer « remboursé » puis « capturé » puis « remboursé » en double : statut final « remboursé », un seul remboursement comptabilisé."
  - titre: "Données de carte dans les journaux"
    description: "Un intercepteur HTTP ou un message d'erreur journalise la requête complète."
    test: "Provoquer une erreur de validation sur un paiement et rechercher le PAN de test et le cryptogramme dans tous les journaux : aucune occurrence."
  - titre: "Rétrofacturation après remboursement"
    description: "Une contestation arrive sur un paiement déjà remboursé ; le marchand perd deux fois le montant."
    test: "Rembourser un paiement puis recevoir une rétrofacturation : alerte et procédure de contestation avec la preuve du remboursement."
reglementations:
  - nom: "DSP2 / PSD2 (et futur PSD3 / PSR)"
    rappel: "Rappel : authentification forte, exemptions encadrées, accès des prestataires tiers aux comptes (API d'accès), responsabilité en cas de fraude."
  - nom: "PCI-DSS v4.0"
    rappel: "Rappel : protection des données de carte ; interdiction de stocker les données d'authentification sensibles (CVV) après autorisation."
  - nom: "Règlement SEPA et virements instantanés (UE 2024/886)"
    rappel: "Rappel : virements instantanés en 10 secondes, au même prix que les virements classiques, vérification du bénéficiaire."
  - nom: "LCB-FT / AMLD et sanctions"
    rappel: "Rappel : connaissance client, surveillance des opérations, filtrage des listes de sanctions, déclaration de soupçon."
  - nom: "RGPD"
    rappel: "Rappel : les données bancaires sont personnelles ; minimisation et durée de conservation à définir."
questions_ba:
  - "Que doit voir le client si la banque ou le prestataire ne répond pas à temps ?"
  - "Quelles exemptions d'authentification forte veut-on utiliser, et qui porte le risque de fraude ?"
  - "Quels sont les cut-off et le calendrier de chaque moyen de paiement, et quelle date d'exécution affiche-t-on ?"
  - "Les remboursements peuvent-ils être partiels, multiples, et jusqu'à quel délai ?"
  - "Comment et à quelle fréquence le rapprochement est-il fait, et qui traite les écarts ?"
  - "Quelles devises sont acceptées et comment les montants sont-ils arrondis et convertis ?"
  - "Comment traite-t-on une rétrofacturation : notification, preuves, délais de réponse ?"
  - "Où sont stockées les données de carte et sont-elles tokenisées ?"
