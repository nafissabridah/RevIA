id: "secteur-public"
nom:
  fr: "Secteur public et services aux usagers"
  en: "Public sector & citizen services"
description: "Démarches en ligne, accessibilité, identité numérique, délais légaux, archivage, données ouvertes et sobriété numérique."
description_en: "Online procedures, accessibility, digital identity, legal deadlines, archiving, open data and digital sobriety."
glossaire:
  "RGAA": "Référentiel général d'amélioration de l'accessibilité, déclinaison française des WCAG, obligatoire pour les services publics."
  "Déclaration d'accessibilité": "Page publique obligatoire indiquant le niveau de conformité, les dérogations et un moyen de contact."
  "FranceConnect": "Dispositif d'identification de l'État permettant d'utiliser un compte existant (impots.gouv, Ameli…) pour une démarche."
  "eIDAS": "Règlement européen sur l'identification électronique et les services de confiance (signatures, cachets, horodatage)."
  "Dites-le-nous une fois": "Principe selon lequel l'administration ne redemande pas une information qu'elle détient déjà."
  "Délai de recours": "Délai pendant lequel une décision administrative peut être contestée (en général deux mois en France)."
  "Silence vaut acceptation (SVA)": "Principe selon lequel l'absence de réponse dans un délai vaut acceptation, sauf exceptions listées."
  "Archivage intermédiaire / définitif": "Conservation des documents pour besoin administratif, puis versement aux archives pour ceux à valeur historique."
  "RGESN": "Référentiel général d'écoconception de services numériques."
regles:
  - id: "PUB-01"
    texte: "Toutes les pages et démarches atteignent le niveau RGAA 4 / WCAG 2.2 AA : navigation au clavier, alternatives textuelles, contrastes, formulaires étiquetés, messages d'erreur annoncés."
    pourquoi: "Obligation légale avec sanctions, et condition d'accès au service pour tous les usagers."
    exemple_bug: "Le sélecteur de date personnalisé n'est pas utilisable au clavier : un usager aveugle ne peut pas déposer sa demande."
  - id: "PUB-02"
    texte: "Toute décision notifiée indique sa date, ses motifs, les voies et délais de recours ; les délais sont calculés selon les règles légales (jour de départ, report au jour ouvré suivant)."
    pourquoi: "Sans mention des voies et délais de recours, le délai ne court pas ; une erreur de calcul prive l'usager de son droit."
    exemple_bug: "Le délai de deux mois est calculé à partir de la date de signature au lieu de la date de notification."
  - id: "PUB-03"
    texte: "Une démarche doit pouvoir être réalisée sans identité numérique ou avec un accompagnement (accueil, téléphone), et un dépôt donne un accusé de réception daté."
    pourquoi: "Égal accès au service public et preuve du dépôt (l'accusé de réception fait courir les délais)."
    exemple_bug: "Le formulaire n'est accessible qu'après FranceConnect, sans alternative pour les usagers sans compte."
  - id: "PUB-04"
    texte: "Les informations déjà détenues par l'administration sont récupérées via les API d'échange plutôt que redemandées, avec le consentement ou l'information de l'usager."
    pourquoi: "Principe « Dites-le-nous une fois » ; réduction des erreurs de saisie et des pièces justificatives."
    exemple_bug: "L'usager doit téléverser un avis d'imposition alors que l'information est disponible par API."
  - id: "PUB-05"
    texte: "Chaque type de document a une durée d'utilité administrative et un sort final (destruction ou versement aux archives) définis avec le service d'archives."
    pourquoi: "Les archives publiques sont régies par le Code du patrimoine ; une destruction non autorisée est illégale."
    exemple_bug: "Une purge RGPD automatique détruit des dossiers qui devaient être versés aux archives départementales."
  - id: "PUB-06"
    texte: "Les données publiables (non personnelles, non couvertes par un secret) sont diffusées en données ouvertes dans un format réutilisable, avec leur date de mise à jour."
    pourquoi: "Obligation d'ouverture par défaut (loi pour une République numérique) et transparence."
    exemple_bug: "Le jeu de données publié contient une colonne avec les noms des demandeurs."
  - id: "PUB-07"
    texte: "Les contenus et messages sont rédigés en langage clair, et les démarches destinées à un public international sont disponibles dans les langues prévues."
    pourquoi: "La compréhension du message conditionne l'exercice des droits."
    exemple_bug: "Le message d'erreur affiché est « Erreur 422 : payload invalide »."
  - id: "PUB-08"
    texte: "Le service limite son impact environnemental : poids des pages maîtrisé, fonctionnement sur des terminaux anciens et des connexions lentes, pas de fonctionnalité superflue."
    pourquoi: "Référentiel RGESN et inclusion des usagers peu équipés."
    exemple_bug: "La page d'accueil pèse 8 Mo à cause d'une vidéo en lecture automatique : inutilisable en 3G."
pieges:
  - titre: "Erreurs de formulaire non annoncées"
    description: "Les erreurs apparaissent en rouge sans être lues par les lecteurs d'écran ni liées au champ."
    test: "Valider un formulaire vide avec NVDA ou VoiceOver : chaque erreur est annoncée et associée à son champ."
  - titre: "Délai de recours mal calculé"
    description: "Mauvaise date de départ (signature au lieu de notification) ou absence de report quand le délai finit un samedi, un dimanche ou un jour férié."
    test: "Notification le 31 décembre : vérifier la date de fin du délai de deux mois et son report éventuel au jour ouvré suivant."
  - titre: "Délai d'inactivité de session trop court"
    description: "La session expire pendant le remplissage d'un long formulaire, sans avertissement."
    test: "Remplir le formulaire lentement : avertissement avant expiration, possibilité de prolonger, brouillon conservé."
  - titre: "Pièces justificatives trop lourdes"
    description: "Le téléversement refuse les photos de smartphone ou échoue sans message."
    test: "Téléverser une photo de 12 Mo : compression proposée ou message clair indiquant la taille maximale."
  - titre: "Noms et adresses atypiques"
    description: "Les champs refusent les noms composés, les apostrophes, les noms à un seul mot ou les adresses étrangères."
    test: "Saisir « N'Diaye-Le Gall » et un nom unique sans prénom : acceptés et correctement affichés."
  - titre: "Données personnelles dans l'open data"
    description: "Un export open data inclut des champs ou des combinaisons permettant de réidentifier des personnes."
    test: "Vérifier chaque colonne du jeu publié et les petites cellules (moins de 11 personnes) qui permettent la réidentification."
reglementations:
  - nom: "RGAA 4 / WCAG 2.2"
    rappel: "Rappel : accessibilité obligatoire pour les services publics, déclaration d'accessibilité et schéma pluriannuel."
  - nom: "Code des relations entre le public et l'administration (CRPA)"
    rappel: "Rappel : accusé de réception, silence vaut acceptation, motivation des décisions, droit à l'erreur."
  - nom: "eIDAS 2"
    rappel: "Rappel : identité numérique européenne (portefeuille EUDI) et niveaux de garantie de l'identification."
  - nom: "Loi pour une République numérique"
    rappel: "Rappel : ouverture des données par défaut, transparence des algorithmes publics utilisés pour des décisions individuelles."
  - nom: "Code du patrimoine (archives publiques)"
    rappel: "Rappel : les documents produits par l'administration sont des archives publiques ; leur élimination nécessite un visa."
  - nom: "RGPD"
    rappel: "Rappel : base légale souvent la mission d'intérêt public ou l'obligation légale ; information des usagers et délégué à la protection des données."
questions_ba:
  - "Quels usagers sont concernés, y compris ceux sans ordinateur, sans identité numérique ou en situation de handicap ?"
  - "Quelle base légale fonde la démarche, et quels délais légaux s'appliquent ?"
  - "Quelles informations l'administration détient-elle déjà et peut-elle récupérer par API ?"
  - "Que reçoit l'usager comme preuve de dépôt, et quand ?"
  - "Quelles voies de recours doivent être indiquées avec la décision ?"
  - "Quelle est la durée de conservation et le sort final de chaque document ?"
  - "Une décision est-elle prise par un algorithme ? Comment est-elle expliquée à l'usager ?"
  - "Quelles données peuvent être publiées en open data, et avec quelle anonymisation ?"
