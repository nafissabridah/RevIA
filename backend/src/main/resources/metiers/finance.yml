id: "finance"
nom:
  fr: "Finance et marchés de capitaux"
  en: "Finance & capital markets"
description: "Gestion d'actifs, marchés, comptabilité financière : valorisation, ordres, conventions de calcul, calendriers et obligations de reporting."
description_en: "Asset management, capital markets and financial accounting: valuation, orders, calculation conventions, calendars and reporting duties."
glossaire:
  "Valeur liquidative (VL / NAV)": "Valeur d'une part de fonds : actif net divisé par le nombre de parts, calculée à une fréquence définie (quotidienne, hebdomadaire)."
  "Date de valeur": "Date à laquelle un mouvement produit ses effets financiers (intérêts), distincte de la date d'opération et de la date de comptabilisation."
  "Règlement-livraison (T+1 / T+2)": "Délai entre la négociation et l'échange effectif titres contre espèces ; T+1 aux États-Unis depuis mai 2024, prévu en Europe en octobre 2027."
  "Base de calcul (day count)": "Convention de décompte des jours pour les intérêts : ACT/360, ACT/365, ACT/ACT, 30/360…"
  "Cut-off": "Heure limite au-delà de laquelle un ordre ou une souscription est traité sur la valeur ou le jour suivant."
  "Coupon couru": "Intérêts acquis depuis le dernier paiement de coupon d'une obligation, payés par l'acheteur au vendeur."
  "ISIN": "Code international à 12 caractères identifiant un titre financier, avec une clé de contrôle (norme ISO 6166)."
  "LEI": "Identifiant d'entité juridique à 20 caractères (ISO 17442), exigé dans de nombreux reportings réglementaires."
  "Mark-to-market": "Valorisation d'une position au prix de marché du jour."
  "Écriture comptable équilibrée": "Écriture dont la somme des débits égale la somme des crédits, dans la même devise."
  "ECL (pertes de crédit attendues)": "Dépréciation calculée selon IFRS 9 en trois stades selon la dégradation du risque de crédit."
regles:
  - id: "FIN-01"
    texte: "Les montants et les prix sont stockés en décimal exact avec la précision de la devise (ISO 4217 : 0 décimale pour JPY, 2 pour EUR, 3 pour BHD) ou de l'instrument."
    pourquoi: "Une précision fixe à 2 décimales ou un type flottant produit des écarts de valorisation et de rapprochement."
    exemple_bug: "Un ordre en dinars bahreïniens arrondi à 2 décimales perd 0,005 BHD par ligne ; le compte espèces ne se rapproche plus."
  - id: "FIN-02"
    texte: "Chaque calcul d'arrondi précise le mode (demi-pair dit « bancaire », demi-supérieur, troncature) et le niveau (par ligne ou sur le total)."
    pourquoi: "Deux systèmes qui arrondissent différemment ne donnent jamais le même total : écarts récurrents de rapprochement."
    exemple_bug: "Les frais sont arrondis par ligne dans le front-office et sur le total au back-office : 3 centimes d'écart par lot de 100 ordres."
  - id: "FIN-03"
    texte: "Le calcul des intérêts utilise la base de calcul contractuelle de l'instrument (ACT/360, ACT/365, 30/360…) et la date de valeur, pas la date d'opération."
    pourquoi: "Une mauvaise base change le montant d'intérêts, surtout sur de gros nominaux."
    exemple_bug: "Un prêt en EUR prévu en ACT/360 est calculé en ACT/365 : sous-facturation de 1,4 % des intérêts."
  - id: "FIN-04"
    texte: "Les échéances et les dates de règlement sont calculées en jours ouvrés selon le calendrier du marché concerné (TARGET2, place locale), avec la convention de report (Following, Modified Following)."
    pourquoi: "Un règlement prévu un jour férié échoue ou est décalé ; les pénalités CSDR s'appliquent aux règlements en retard."
    exemple_bug: "Un règlement T+2 calculé sur le calendrier français tombe un jour férié américain pour un titre US : suspens de règlement."
  - id: "FIN-05"
    texte: "Les ordres reçus après l'heure de cut-off, exprimée dans le fuseau de la place ou du fonds, sont exécutés sur la VL ou la séance suivante."
    pourquoi: "Accepter un ordre tardif sur la VL du jour permet l'arbitrage sur VL connue (market timing), interdit."
    exemple_bug: "Le cut-off 12 h est comparé à l'heure UTC du serveur : en été, les ordres de 12 h 30 à Paris passent sur la VL du jour."
  - id: "FIN-06"
    texte: "Toute écriture comptable est équilibrée (débit = crédit) par devise et ne peut être supprimée : une correction se fait par contre-passation."
    pourquoi: "La comptabilité doit rester auditable ; une suppression casse la piste d'audit et les soldes historiques."
    exemple_bug: "Un écran d'administration permet de supprimer une écriture erronée : le grand livre du mois clos ne correspond plus au bilan publié."
  - id: "FIN-07"
    texte: "La conversion de devises enregistre le taux utilisé, sa source et son horodatage ; un même traitement utilise un seul jeu de taux figé."
    pourquoi: "Sans taux tracé, une valorisation n'est pas reproductible ; des taux qui changent pendant le traitement faussent les totaux."
    exemple_bug: "Le reporting du soir relit le taux « courant » à chaque ligne : les premières lignes et les dernières utilisent deux taux différents."
  - id: "FIN-08"
    texte: "Avant de transmettre un ordre, le système vérifie les limites (position, crédit, concentration, liste d'instruments interdits) et journalise le contrôle."
    pourquoi: "Un ordre hors limite expose la société à une perte ou à une sanction ; le contrôle doit être prouvable."
    exemple_bug: "Le contrôle de limite n'est fait qu'à la création : la modification de quantité d'un ordre existant passe sans contrôle."
  - id: "FIN-09"
    texte: "Les ordres clients sont horodatés à la milliseconde (ou plus fin) à chaque étape avec une horloge synchronisée, et conservés au moins 5 ans."
    pourquoi: "MiFID II (RTS 25) impose la synchronisation des horloges et la conservation des enregistrements pour prouver la meilleure exécution."
    exemple_bug: "Les horodatages sont tronqués à la seconde : impossible de démontrer l'ordre de priorité entre deux ordres clients."
  - id: "FIN-10"
    texte: "Les valorisations et calculs réglementaires sont reproductibles : on peut recalculer une date passée avec les données de marché et paramètres de cette date (bitemporalité)."
    pourquoi: "Les auditeurs et régulateurs demandent de justifier un chiffre publié ; écraser l'historique le rend impossible."
    exemple_bug: "Une correction de prix d'hier écrase l'ancien prix : la VL déjà publiée ne peut plus être expliquée."
  - id: "FIN-11"
    texte: "Les identifiants d'instruments et d'entités (ISIN, LEI) sont validés par leur clé de contrôle et leur format avant enregistrement."
    pourquoi: "Un identifiant erroné rejette le reporting réglementaire ou rattache l'opération au mauvais titre."
    exemple_bug: "Un ISIN saisi avec une lettre O au lieu d'un zéro est accepté ; le reporting de transactions est rejeté par le régulateur."
  - id: "FIN-12"
    texte: "Les opérations sur titres (dividendes, divisions, fusions) ajustent positions, prix historiques et coûts moyens à la date d'effet."
    pourquoi: "Sans ajustement, les performances et les plus-values calculées sont fausses."
    exemple_bug: "Après une division d'action par 2, le prix est mis à jour mais pas la quantité : la valeur de la position est divisée par 2."
pieges:
  - titre: "Montants en virgule flottante"
    description: "double / float ne représentent pas exactement les décimales ; les sommes de nombreuses lignes dérivent."
    test: "Sommer 10 000 lignes de 0,01 EUR et exiger exactement 100,00 ; refuser toute comparaison de montants avec une tolérance implicite."
  - titre: "Arrondi bancaire contre arrondi commercial"
    description: "2,345 arrondi au demi-pair donne 2,34, au demi-supérieur 2,35 ; les systèmes ne s'accordent pas."
    test: "Arrondir 2,345 ; 2,355 ; -2,345 et comparer au mode documenté (y compris pour les valeurs négatives)."
  - titre: "Devises à 0 ou 3 décimales"
    description: "Le code suppose 2 décimales pour toutes les devises."
    test: "Passer un ordre de 1 234 JPY et de 1,235 BHD : aucun « 1 234,00 JPY », aucune perte du 3e chiffre."
  - titre: "Fin de mois et années bissextiles"
    description: "Ajouter un mois au 31 janvier ou calculer une échéance au 29 février donne des dates invalides ou décalées."
    test: "Échéancier mensuel démarrant le 31/01/2028 : vérifier 29/02/2028, 31/03/2028, 30/04/2028 selon la convention de fin de mois."
  - titre: "Jours fériés de plusieurs places"
    description: "Un seul calendrier est utilisé pour un instrument qui dépend de deux places (devise et marché)."
    test: "Règlement d'un titre US en EUR le 4 juillet : la date de règlement doit sauter le jour férié américain."
  - titre: "Cut-off et changement d'heure"
    description: "L'heure limite est comparée en UTC ou dans le fuseau du serveur au lieu du fuseau de la place."
    test: "Ordres à 11 h 59 et 12 h 01 heure de Paris, en hiver et en été, avec le serveur en UTC : bascule exacte à 12 h 00 locale."
  - titre: "Taux de change relu en cours de traitement"
    description: "Le taux est recherché à chaque ligne et change pendant l'exécution du lot."
    test: "Modifier le taux pendant un batch de valorisation simulé : toutes les lignes doivent utiliser le taux figé au départ."
  - titre: "Signe des montants (débit / crédit)"
    description: "Montants signés et sens débit / crédit sont mélangés ; un remboursement devient un double débit."
    test: "Annuler une opération de +500 : le solde revient exactement à l'initial et l'écriture de contre-passation a le sens inverse."
  - titre: "Ordre partiellement exécuté"
    description: "Le statut ne prévoit que « exécuté » ou « rejeté » ; les exécutions partielles et les annulations du reliquat sont mal gérées."
    test: "Ordre de 1 000 titres exécuté en 3 fois (300, 300, 400) puis annulation : quantités et prix moyen pondéré corrects à chaque étape."
  - titre: "Recalcul qui écrase l'historique"
    description: "Une correction rétroactive remplace les données au lieu de créer une nouvelle version datée."
    test: "Corriger le prix d'hier puis demander la VL d'hier « telle que publiée » et « telle que corrigée » : deux valeurs distinctes disponibles."
  - titre: "Pourcentages et points de base"
    description: "Confusion entre 0,5 %, 0,005 et 50 points de base dans les paramètres de frais ou de taux."
    test: "Saisir des frais de 50 bp sur 1 000 000 EUR : 5 000 EUR attendus, et non 500 000 ou 50."
reglementations:
  - nom: "MiFID II / MiFIR"
    rappel: "Rappel : meilleure exécution, adéquation / caractère approprié, reporting des transactions, enregistrement des ordres et synchronisation des horloges."
  - nom: "IFRS 9"
    rappel: "Rappel : classement et évaluation des instruments financiers, dépréciation par pertes de crédit attendues (3 stades), comptabilité de couverture."
  - nom: "Lutte anti-blanchiment (AMLD / LCB-FT)"
    rappel: "Rappel : connaissance client (KYC), filtrage des sanctions, détection et déclaration des opérations suspectes."
  - nom: "EMIR"
    rappel: "Rappel : déclaration des dérivés à un référentiel central, compensation obligatoire et techniques d'atténuation des risques."
  - nom: "CSDR"
    rappel: "Rappel : discipline de règlement, pénalités en cas de règlement en retard."
  - nom: "PRIIPs"
    rappel: "Rappel : document d'informations clés (DIC / KID) pour les produits d'investissement packagés destinés aux particuliers."
questions_ba:
  - "Quelle convention d'arrondi (mode et niveau) et quelle base de calcul des intérêts s'appliquent ?"
  - "Quel calendrier de jours ouvrés et quelle convention de report utiliser pour cette devise et ce marché ?"
  - "Quelle est l'heure de cut-off, dans quel fuseau, et que devient un ordre reçu après ?"
  - "D'où viennent les prix et les taux de change, à quelle heure sont-ils figés, et que fait-on s'ils manquent ?"
  - "Doit-on pouvoir recalculer un chiffre passé tel qu'il a été publié ? Combien de temps ?"
  - "Quels contrôles de limites ou de conformité doivent bloquer l'opération, et qui peut forcer ?"
  - "Comment gère-t-on les exécutions partielles, les annulations et les corrections ?"
  - "Quels reportings réglementaires consomment ces données, et sous quel format ?"
  - "Qui valide (principe des quatre yeux) et quelles actions doivent être tracées ?"
