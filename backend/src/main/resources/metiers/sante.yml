id: "sante"
nom:
  fr: "Santé (soins, dossier patient, médicaments)"
  en: "Healthcare (care, patient records, medication)"
description: "Logiciels de soins et de santé : identité patient, consentement, données sensibles, prescriptions, unités, traçabilité et interopérabilité."
description_en: "Care and health software: patient identity, consent, sensitive data, prescriptions, units, audit trail and interoperability."
glossaire:
  "INS (identité nationale de santé)": "Identifiant de santé de référence en France (NIR ou NIA) associé à des traits d'identité qualifiés via le téléservice INSi."
  "Identitovigilance": "Organisation et contrôles qui garantissent que chaque donnée est rattachée au bon patient."
  "Consentement": "Accord libre, éclairé et traçable du patient ; certaines utilisations reposent sur une autre base légale mais exigent une information."
  "HDS": "Certification Hébergeur de Données de Santé, obligatoire en France pour héberger des données de santé pour le compte de tiers."
  "Minimum nécessaire": "Principe HIPAA : n'accéder qu'aux informations de santé strictement nécessaires à la tâche."
  "HL7 FHIR": "Standard d'échange de données de santé par ressources (Patient, Observation, MedicationRequest…) via des API REST."
  "Accès « bris de glace »": "Accès d'urgence à un dossier hors des droits habituels, autorisé mais justifié et contrôlé a posteriori."
  "UCUM": "Code unifié des unités de mesure utilisé en santé (mg, ug, mmol/L…)."
  "Pseudonymisation": "Remplacement des identifiants directs par un pseudonyme ; les données restent personnelles contrairement à l'anonymisation."
regles:
  - id: "SAN-01"
    texte: "Toute donnée clinique est rattachée à une identité patient qualifiée (INS ou identifiant local vérifié) ; le rapprochement se fait sur plusieurs traits stricts, jamais sur le seul nom."
    pourquoi: "Une erreur d'identité entraîne un soin, un résultat ou un médicament destiné à un autre patient."
    exemple_bug: "Deux patients homonymes nés la même année sont fusionnés : les allergies de l'un apparaissent chez l'autre."
  - id: "SAN-02"
    texte: "L'accès au dossier est limité aux professionnels qui prennent en charge le patient, selon leur rôle ; tout accès est journalisé et consultable."
    pourquoi: "Le secret médical et le RGPD imposent un accès strictement nécessaire et traçable."
    exemple_bug: "Tout le personnel de l'établissement peut consulter le dossier d'une personnalité hospitalisée, sans trace."
  - id: "SAN-03"
    texte: "L'opposition ou le consentement du patient (partage, recherche, télésanté) est enregistré, daté, révocable, et vérifié avant chaque usage concerné."
    pourquoi: "Utiliser une donnée malgré une opposition expose l'établissement à des sanctions et rompt la confiance."
    exemple_bug: "Le patient retire son consentement à la recherche, mais l'export de la cohorte du mois suivant l'inclut encore."
  - id: "SAN-04"
    texte: "Toute dose, posologie ou résultat de laboratoire est stocké avec son unité codée (UCUM) et les conversions d'unités sont explicites et testées."
    pourquoi: "Une confusion mg / ug (microgramme) multiplie la dose par 1 000."
    exemple_bug: "Une prescription saisie en microgrammes est relue comme des milligrammes par le module de dispensation."
  - id: "SAN-05"
    texte: "Les prescriptions sont contrôlées (allergies, interactions, dose maximale selon l'âge et le poids, fonction rénale) avant validation, et un passage outre est motivé et tracé."
    pourquoi: "Les erreurs médicamenteuses sont une cause majeure d'événements indésirables graves évitables."
    exemple_bug: "Le poids utilisé pour la dose pédiatrique est le dernier poids connu datant de deux ans."
  - id: "SAN-06"
    texte: "Une donnée clinique validée n'est jamais modifiée ni supprimée : elle est corrigée par une nouvelle version signée qui conserve l'originale."
    pourquoi: "Le dossier médical a une valeur médico-légale ; l'historique doit être intégral."
    exemple_bug: "La correction d'un compte rendu écrase le texte initial sur lequel une décision thérapeutique avait été prise."
  - id: "SAN-07"
    texte: "Les données de santé sont hébergées chez un hébergeur certifié (HDS en France) et chiffrées en transit et au repos ; les environnements de test n'utilisent pas de données réelles non pseudonymisées."
    pourquoi: "Obligation légale ; les copies de production en recette sont une source fréquente de fuite."
    exemple_bug: "Une copie de la base de production est restaurée sur un serveur de recette accessible aux prestataires."
  - id: "SAN-08"
    texte: "Les âges, délais et horaires de soins (administration toutes les 8 h, âge en mois pour la pédiatrie) sont calculés précisément, y compris aux changements d'heure."
    pourquoi: "Un décalage d'une heure ou une erreur d'âge change une dose ou un calendrier vaccinal."
    exemple_bug: "Le plan d'administration « toutes les 8 h » saute une prise la nuit du passage à l'heure d'été."
pieges:
  - titre: "Homonymes et doublons d'identité"
    description: "La recherche patient retient le premier résultat sur nom et prénom."
    test: "Créer deux patients homonymes nés le même jour avec des lieux de naissance différents : aucun rapprochement automatique, alerte de doublon potentiel."
  - titre: "Confusion d'unités"
    description: "Champs de dose sans unité, ou unité libre en texte."
    test: "Saisir 500 ug et vérifier l'affichage, la conversion en 0,5 mg et le contrôle de dose maximale."
  - titre: "Poids ou âge périmé"
    description: "Le calcul de dose utilise une mesure ancienne sans alerte."
    test: "Prescription pédiatrique avec un dernier poids datant de plus de 30 jours : alerte et demande de nouvelle mesure."
  - titre: "Consentement révoqué non propagé"
    description: "La révocation est enregistrée mais les traitements par lots ou les exports ne la relisent pas."
    test: "Révoquer le consentement puis lancer l'export recherche : le patient est exclu."
  - titre: "Journal d'accès incomplet"
    description: "Seules les modifications sont tracées, pas les consultations, ou l'accès bris de glace n'est pas signalé."
    test: "Consulter un dossier en bris de glace : trace avec justification et notification au responsable."
  - titre: "Données réelles en recette"
    description: "Jeux de test copiés de la production sans pseudonymisation."
    test: "Contrôler qu'aucun identifiant réel (INS, nom, date de naissance) n'existe dans les jeux de données de recette."
  - titre: "Changement d'heure dans les plans de soins"
    description: "Les prises programmées toutes les N heures sont calculées en heure locale naïve."
    test: "Plan toutes les 8 h démarrant à 22 h la veille du passage à l'heure d'été : prises espacées de 8 h réelles."
reglementations:
  - nom: "RGPD art. 9"
    rappel: "Rappel : les données de santé sont des données sensibles ; traitement interdit sauf exception (soins, consentement explicite, intérêt public…)."
  - nom: "HDS (Code de la santé publique, art. L.1111-8)"
    rappel: "Rappel : l'hébergement de données de santé pour le compte de tiers exige un hébergeur certifié HDS en France."
  - nom: "HIPAA (États-Unis)"
    rappel: "Rappel : Privacy Rule (minimum nécessaire), Security Rule (contrôles techniques), notification des violations."
  - nom: "Règlement européen sur les dispositifs médicaux (MDR 2017/745)"
    rappel: "Rappel : un logiciel ayant une finalité médicale (aide au diagnostic, calcul de dose) peut être un dispositif médical soumis au marquage CE."
  - nom: "Espace européen des données de santé (EHDS)"
    rappel: "Rappel : règlement adopté en 2025, droits d'accès des patients et interopérabilité des dossiers, application progressive."
  - nom: "Référentiel INS et identitovigilance"
    rappel: "Rappel : en France, usage obligatoire de l'INS qualifiée pour référencer les données de santé."
questions_ba:
  - "Comment le patient est-il identifié et que se passe-t-il en cas de doute ou de doublon ?"
  - "Quels professionnels ont accès à quelles données, et existe-t-il un accès d'urgence ?"
  - "Quels consentements ou oppositions s'appliquent, et comment leur révocation est-elle prise en compte ?"
  - "Quelles unités sont utilisées et quelles conversions sont nécessaires ?"
  - "Quels contrôles de sécurité médicamenteuse sont attendus et qui peut passer outre ?"
  - "Où sont hébergées les données et l'hébergeur est-il certifié ?"
  - "Le logiciel a-t-il une finalité médicale qui en ferait un dispositif médical ?"
  - "Quels standards d'interopérabilité (FHIR, HL7 v2, DMP) doivent être respectés ?"
