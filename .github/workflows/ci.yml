# Tests lancés automatiquement à chaque push (JUnit 5 / Mockito / MockMvc + Karma) et build Docker.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Même suite de tests, mais sur un vrai PostgreSQL (la production) : migrations Flyway + validation du schéma JPA
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: revia
          POSTGRES_USER: revia
          POSTGRES_PASSWORD: revia-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U revia" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/revia
      SPRING_DATASOURCE_USERNAME: revia
      SPRING_DATASOURCE_PASSWORD: revia-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Tests sur PostgreSQL
        run: mvn -B test


  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Tests + package
        run: mvn -B verify
      - name: Rapport du jeu d'essai IA
        if: always()
        run: cat target/jeu-essai-rapport.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-tests-backend
          path: backend/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npx ng build --configuration production

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests du script CI (tests prouvés, commentaires en ligne)
        run: python -m unittest integrations/test_revia_ci.py

  docker:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend, integrations]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t revia-backend ./backend
      - run: docker build -t revia-frontend ./frontend
