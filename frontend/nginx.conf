server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API Spring Boot (même origine : pas de CORS, la clé d'API reste côté serveur)
    location /api/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
        # Réponses de l'IA diffusées en direct (SSE) : pas de mise en tampon
        proxy_buffering off;
        proxy_cache off;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        # un add_header ici remplace ceux du serveur : on les répète
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # Routes Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
